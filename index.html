      </div>
      <div v-if="!consolidated" class="table-wrap hidden md:block"><table class="data light"><thead><tr><th>#</th><th>Fecha</th><th>Local</th><th>Vendedor</th><th>Pago</th><th class="!text-right">Items</th><th class="!text-right">Total</th><th class="!text-center">Acción</th></tr></thead>
        <tbody><tr v-for="s in list" :key="s.id"><td class="font-mono text-slate-500">#{{ s.id }}</td><td class="whitespace-nowrap">{{ fmtShort(s.date) }}</td><td class="whitespace-nowrap">{{ wName(s.warehouse_id) }}</td><td class="whitespace-nowrap">{{ (U(s.user_id) || {}).name }}</td><td class="whitespace-nowrap">{{ payLabel(s.payment_method) }}</td>
          <td class="text-right tnum">{{ s.items.reduce((t, it) => t + it.q, 0) }}</td><td class="text-right font-semibold tnum whitespace-nowrap">{{ money(s.total) }}</td>
          <td class="text-center whitespace-nowrap"><button class="btn-secondary btn-xs" @click="open(s)">Detalle</button> <button v-if="isAdmin" class="btn-danger btn-xs" @click="delSale(s)">Eliminar</button></td></tr>
        <tr v-if="!list.length"><td colspan="8" class="py-10 text-center text-slate-400">No hay ventas para los filtros seleccionados</td></tr></tbody></table></div>
      <div v-else class="soft-panel space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2"><h3 class="section-title">Consolidado de Productos Vendidos</h3></div>
        <div class="max-w-md"><label class="form-label" for="s-cq">Búsqueda rápida (nombre o código)</label><input id="s-cq" class="form-input" v-model="cq" placeholder="Ej: DD1391 o Dunk"/></div>
        <div class="md:hidden space-y-2"><div v-for="(x, i) in consol" :key="i" class="rounded-xl border border-slate-200 bg-white p-3">
          <div class="flex items-start justify-between gap-2"><p class="font-semibold">{{ pName(x.p) }}</p><span class="shrink-0 rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-semibold text-emerald-700">{{ x.q }} uds</span></div>
          <div class="mt-1 grid grid-cols-3 gap-2 text-xs"><div><p class="text-slate-400">Unitario</p><p>{{ money(x.price) }}</p></div><div><p class="text-slate-400">Total vendido</p><p class="font-semibold">{{ money(x.q * x.price) }}</p></div><div><p class="text-slate-400">Local salida</p><p>{{ wName(x.w) }}</p></div></div></div>
          <p v-if="!consol.length" class="py-8 text-center text-slate-400">No hay productos vendidos en el rango seleccionado.</p></div>
        <div class="table-wrap hidden md:block"><table class="data light"><thead><tr><th>Producto</th><th class="!text-right">Cantidad</th><th class="!text-right">Precio unitario</th><th class="!text-right">Total vendido</th><th>Local salida</th></tr></thead>
          <tbody><tr v-for="(x, i) in consol" :key="i"><td>{{ pName(x.p) }}</td><td class="text-right"><span class="rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-semibold text-emerald-700">{{ x.q }} uds</span></td><td class="text-right tnum">{{ money(x.price) }}</td><td class="text-right font-semibold tnum">{{ money(x.q * x.price) }}</td><td class="whitespace-nowrap">{{ wName(x.w) }}</td></tr>
          <tr v-if="!consol.length"><td colspan="5" class="py-8 text-center text-slate-400">No hay productos vendidos en el rango seleccionado.</td></tr></tbody></table></div>
      </div>
    </div>
    <Modal v-if="detail" :title="'Detalle de venta #' + detail.id" size="max-w-3xl" @close="detail = null">
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div class="rounded-lg bg-slate-50 p-3"><p class="text-xs text-slate-400">Fecha</p><p class="font-medium">{{ fmtShort(detail.date) }}</p></div>
        <div class="rounded-lg bg-slate-50 p-3"><p class="text-xs text-slate-400">Local</p><p class="font-medium">{{ wName(detail.warehouse_id) }}</p></div>
        <div class="rounded-lg bg-slate-50 p-3"><p class="text-xs text-slate-400">Vendedor</p><p class="font-medium">{{ (U(detail.user_id) || {}).name }}</p></div>
        <div class="rounded-lg bg-slate-50 p-3"><p class="text-xs text-slate-400">Pago</p><p class="font-medium">{{ payText(detail) }}</p></div>
        <div class="col-span-2 rounded-lg border border-blue-200 bg-blue-50 p-3"><p class="text-xs text-blue-500">Total</p><p class="text-xl font-bold text-blue-900 tnum">{{ money(detail.total) }}</p></div>
      </div>
      <div class="table-wrap"><table class="data light"><thead><tr><th>Sel.</th><th>Producto</th><th>Talla</th><th class="!text-right">Cant.</th><th class="!text-right">Unit.</th><th class="!text-right">Subtotal</th></tr></thead>
        <tbody><tr v-for="(it, i) in detail.items" :key="i"><td><input type="checkbox" :value="i" v-model="sel" :disabled="!isAdmin" :aria-label="'Seleccionar ' + pName(it.p)"/></td><td>{{ pName(it.p) }}<span v-if="it.exhibition" class="ml-1 rounded bg-indigo-100 px-1.5 text-[11px] text-indigo-700">👟 Exhibición</span></td><td>{{ it.s }}</td><td class="text-right">{{ it.q }}</td><td class="text-right tnum">{{ money(it.price) }}</td><td class="text-right font-semibold tnum">{{ money(it.q * it.price) }}</td></tr></tbody></table></div>
      <template #footer>
        <template v-if="isAdmin"><button class="btn-secondary" @click="sel = sel.length === detail.items.length ? [] : detail.items.map((_, i) => i)">{{ sel.length === detail.items.length ? 'Deseleccionar todo' : 'Seleccionar todo' }}</button><button class="btn-danger" :disabled="!sel.length" @click="delItems">Eliminar seleccionados ({{ sel.length }})</button></template>
        <button class="btn-danger" @click="detail = null">Cerrar</button>
      </template>
    </Modal>
  </div>`,
};
// ───────────────────────── Arranque ─────────────────────────
const PAGES = {
  home: HomePage, dashboard: DashboardPage, users: UsersPage, products: ProductsPage, warehouses: WarehousesPage, purchases: PurchasesPage,
  transfers: TransfersPage, contingencia: ContingencyPage, sales: SalesPage, pos: PosPage, 'solicitudes-historial': SolicitudesHistorialPage,
  'inventory-historial': MovementsPage, cuentas: CuentasPage, notifications: NotificationsPage, profile: ProfilePage,
};

const Root = {
  computed: { logged() { return !!me.value; } },
  template: `<LoginPage v-if="!logged"/><Shell v-else/>`,
};

const app = Vue.createApp(Root);
app.mixin({
  computed: {
    S: () => S, UI: () => UI, LOGO: () => LOGO, SIZES: () => SIZES, PALETTE: () => PALETTE,
    me: () => me.value, role: () => role.value, isAdmin: () => isAdmin.value, isManagerish: () => isManagerish.value, isBodega: () => isBodega.value,
    unreadCount: () => unreadCount.value, bodegaPendingTotal: () => bodegaPendingTotal.value, locales: () => locales.value, bodegas: () => bodegas.value,
  },
  methods: { money, num, pct, fmtDateTime, fmtShort, fmtDay, timeAgo, go, canSee, wName, pName, P, W, U, isLocal, stockOf, payLabel, payType, genderLabel, sneakerImg, toast, Alert: () => Alert },
});
Object.entries({ Icon, Modal, Pager, ProductPicker, MovBadge, ProductThumb, Blobs, Donut, LoginPage, OfflineIndicator, NotificationBell, Shell, HistoryTabs, TransferNormal, TransferExhibition, BodegaSolicitudes })
  .forEach(([name, c]) => app.component(name, c));
app.config.warnHandler = () => {};
app.mount('#app');
</script>
</body>
</html>
