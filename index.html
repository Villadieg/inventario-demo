<style>
/* Sistema de diseño: tema claro fijo. */
:root {
  color-scheme: light;
  --brand-primary: #112a4e;
  --brand-primary-2: #173a6f;
  --brand-line: #93c5fd;
  --brand-text: #0f172a;
  --brand-muted: #475569;
  --brand-red: #dc5c4d;
  --demo-strip: #0b1d38;
}
html, body { background: #ffffff; color: var(--brand-text); }
body { font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
#app { width: 100%; max-width: 100%; overflow-x: hidden; }
[v-cloak] { display: none; }
.svg-icon { display: inline-block; height: 1em; width: auto; vertical-align: -0.125em; flex-shrink: 0; overflow: visible; }
.tnum { font-variant-numeric: tabular-nums; }

.page-title { font-size: 1.5rem; line-height: 2rem; font-weight: 700; color: var(--brand-text); letter-spacing: .015em; }
@media (min-width: 768px) { .page-title { font-size: 1.875rem; line-height: 2.25rem; } }
.section-title { font-size: 1.125rem; font-weight: 600; color: var(--brand-text); }
@media (min-width: 768px) { .section-title { font-size: 1.25rem; } }
.section-subtitle { font-size: .875rem; font-weight: 500; color: var(--brand-muted); }

.btn-primary, .btn-secondary, .btn-danger, .btn-success {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem; font-weight: 600;
  padding: .625rem 1rem; border-radius: .75rem; transition: all .2s; cursor: pointer; white-space: nowrap;
}
.btn-primary { color: #fff; background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-2)); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 8px 18px rgba(17,42,78,.28); }
.btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(17,42,78,.35); filter: brightness(1.05); }
.btn-secondary { color: var(--brand-text); background: #fff; border: 1px solid var(--brand-line); box-shadow: 0 4px 10px rgba(15,23,42,.08); }
.btn-secondary:hover:not(:disabled) { transform: translateY(-1px); background: #f8fbff; border-color: var(--brand-primary); }
.btn-danger { color: #fff; background: #b54545; border: 1px solid rgba(125,33,33,.35); box-shadow: 0 8px 18px rgba(125,33,33,.22); }
.btn-danger:hover:not(:disabled) { transform: translateY(-1px); background: #a53c3c; }
.btn-success { color: #fff; background: #1f8a5b; border: 1px solid rgba(12,94,58,.35); box-shadow: 0 8px 18px rgba(12,94,58,.24); }
.btn-success:hover:not(:disabled) { transform: translateY(-1px); background: #177a4f; }
button:disabled { opacity: .5; cursor: not-allowed; }
.btn-sm { padding: .45rem .75rem; font-size: .8rem; border-radius: .7rem; }
.btn-xs { padding: .3rem .6rem; font-size: .72rem; border-radius: .6rem; }
:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }

.action-btn { display: inline-flex; align-items: center; justify-content: center; border-radius: .5rem; padding: .5rem; transition: background-color .2s, color .2s; }
.action-btn-edit { color: #4f46e5; } .action-btn-edit:hover { color: #312e81; background: #eef2ff; }
.action-btn-delete { color: #dc2626; } .action-btn-delete:hover { color: #7f1d1d; background: #fef2f2; }
.action-btn-success { color: #059669; } .action-btn-success:hover { color: #064e3b; background: #ecfdf5; }

.form-input { width: 100%; border-radius: .5rem; padding: .375rem .625rem; font-size: .875rem; line-height: 1.25; border: 1px solid var(--brand-line); background: #fff; color: var(--brand-text); min-height: 2.2rem; transition: box-shadow .15s; }
.form-input:focus { outline: none; box-shadow: 0 0 0 2px rgba(63,111,184,.6); }
.form-input:disabled { background: #f1f5f9; color: #94a3b8; }
.form-label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: .25rem; color: var(--brand-muted); }
@media (max-width: 768px) { input, select, textarea { font-size: 16px !important; } }

.app-panel { border-radius: .75rem; border: 1px solid var(--brand-primary); padding: 1rem; background: #fff; box-shadow: 0 8px 20px rgba(17,42,78,.12), 0 0 0 1px rgba(17,42,78,.08); }
.soft-panel { border-radius: .75rem; border: 1px solid rgba(148,163,184,.25); padding: 1rem; background: rgba(255,255,255,.88); box-shadow: 0 8px 20px rgba(17,42,78,.08); }
.field-card { border-radius: .9rem; border: 1px solid #cbd5e1; padding: .75rem; background: linear-gradient(180deg, #f8fafc, #f1f5f9); }
.card-hover { border-radius: 1rem; border: 1px solid var(--brand-primary); background: #fff; box-shadow: 0 10px 22px rgba(17,42,78,.14), 0 0 0 1px rgba(17,42,78,.1); transition: transform .2s, box-shadow .2s; }
.card-hover:hover { transform: translateY(-1px); }
.brand-chip { display: inline-flex; align-items: center; border-radius: 9999px; padding: .25rem .75rem; font-size: .75rem; font-weight: 600; background: linear-gradient(90deg, rgba(59,130,246,.16), rgba(37,99,235,.12)); color: #1e3a8a; border: 1px solid rgba(59,130,246,.25); }

.hero-mint { border-radius: 1rem; padding: 1rem; background: linear-gradient(130deg, rgba(16,185,129,.12), rgba(6,182,212,.1)); border: 1px solid rgba(148,163,184,.25); }
.hero-glass { border-radius: 1rem; padding: 1rem; background: radial-gradient(circle at 0% 0%, rgba(16,185,129,.14), transparent 45%), radial-gradient(circle at 100% 100%, rgba(14,165,233,.14), transparent 45%), linear-gradient(180deg, #fff, #f8fafc); border: 1px solid rgba(148,163,184,.3); box-shadow: 0 18px 40px rgba(15,23,42,.06); }
.hero-slate { border-radius: 1rem; padding: 1rem; background: linear-gradient(180deg, rgba(248,250,252,.9), rgba(241,245,249,.78)); border: 1px solid rgba(148,163,184,.25); }
.hero-indigo { border-radius: 1rem; padding: 1rem; background: linear-gradient(130deg, rgba(99,102,241,.1), rgba(14,165,233,.1)); border: 1px solid rgba(148,163,184,.25); }
.hero-amber { border-radius: 1rem; padding: 1rem; background: linear-gradient(130deg, rgba(16,185,129,.12), rgba(245,158,11,.12)); border: 1px solid rgba(148,163,184,.25); }
.hero-pos { border-radius: 1rem; padding: 1rem; background: linear-gradient(130deg, rgba(14,165,233,.12), rgba(34,197,94,.08)); border: 1px solid rgba(148,163,184,.25); }
@media (min-width: 640px) { .hero-mint, .hero-glass, .hero-slate, .hero-indigo, .hero-amber, .hero-pos { padding: 1.5rem; } }

.blob { position: absolute; height: 18rem; width: 18rem; border-radius: 9999px; filter: blur(64px); pointer-events: none; z-index: 0; }

table.data { width: 100%; font-size: .875rem; border-collapse: collapse; }
table.data thead { background: var(--brand-primary); }
table.data thead th { color: #fff; padding: .7rem .9rem; text-align: left; font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
table.data tbody td { padding: .65rem .9rem; border-top: 1px solid #e5e7eb; vertical-align: middle; }
table.data tbody tr:hover { background: rgba(17,42,78,.06); }
table.data.light thead { background: #f1f5f9; } table.data.light thead th { color: #475569; }
.table-wrap { overflow-x: auto; border-radius: .75rem; border: 1px solid #e2e8f0; background: #fff; }

.sidebar-drawer { transform: translateX(-100%); transition: transform .3s ease; }
.sidebar-drawer.open { transform: none; }
@media (min-width: 768px) { .sidebar-drawer { transform: none; } }
.sidebar-shell { background-color: var(--brand-primary); border-right: 1px solid rgba(147,197,253,.35); }
.sidebar-link { display: flex; align-items: center; gap: .75rem; padding: .7rem 1rem; border-radius: .75rem; color: #cbd5e1; transition: all .15s; border: 1px solid transparent; font-size: .9rem; }
.sidebar-link:hover { background: rgba(255,255,255,.05); color: #fff; }
.sidebar-link-active { color: #fff; background: linear-gradient(90deg, rgba(191,219,254,.26), rgba(239,246,255,.16)); border-color: rgba(219,234,254,.4); }

.modal-overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(7,10,18,.78); backdrop-filter: blur(4px); }
.modal-content { width: 100%; border-radius: 1rem; overflow: hidden; background: #fff; border: 1px solid var(--brand-line); box-shadow: 0 18px 40px rgba(17,42,78,.2); display: flex; flex-direction: column; max-height: 92vh; }
.modal-header { padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; background: var(--brand-primary); color: #fff; }
.modal-body { padding: 1.5rem; overflow-y: auto; }
.modal-footer { padding: 1rem 1.5rem; display: flex; flex-direction: column-reverse; gap: .75rem; border-top: 1px solid var(--brand-line); background: #f8fafc; }
@media (min-width: 640px) { .modal-footer { flex-direction: row; justify-content: flex-end; } }
@media (max-width: 640px) { .modal-body { padding: 1rem; } .modal-header { padding: .85rem 1rem; } }

.auth-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem; background-color: var(--brand-primary); }
.auth-card { width: 100%; max-width: 30rem; border-radius: 1rem; padding: 1.5rem; background: #fff; box-shadow: 0 30px 60px rgba(0,0,0,.35); position: relative; }
.auth-logo { height: 140px; border-radius: .75rem; background: linear-gradient(135deg, #0b0f17, #141a25); display: flex; align-items: center; justify-content: center; gap: .9rem; box-shadow: 0 0 0 1px rgba(239,68,68,.35); animation: pulse-red 1.9s ease-in-out infinite; }
@keyframes pulse-red { 0%,100% { box-shadow: 0 0 0 1px rgba(239,68,68,.25); } 50% { box-shadow: 0 0 0 2px rgba(239,68,68,.8), 0 0 18px rgba(239,68,68,.35); } }

.donut { position: relative; height: 11rem; width: 11rem; border-radius: 9999px; flex-shrink: 0; }
.donut-hole { position: absolute; inset: 22%; border-radius: 9999px; background: #fff; border: 1px solid #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: .25rem; }

.dash-tab { border-radius: 9999px; padding: .55rem 1rem; font-size: .85rem; font-weight: 700; color: #1e3a8a; border: 1px solid rgba(59,130,246,.2); background: linear-gradient(180deg, #fff, rgba(219,234,254,.7)); transition: transform .15s; }
.dash-tab:hover { transform: translateY(-1px); }
.dash-tab.active { background: linear-gradient(180deg, #2563eb, #1d4ed8); color: #fff; box-shadow: 0 8px 18px rgba(37,99,235,.3); }

.fab { position: fixed; right: 1rem; z-index: 40; display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 12px 24px rgba(15,23,42,.25); transition: transform .15s; }
.fab:hover { transform: translateY(-2px); }
.fab-badge { position: absolute; top: -.4rem; right: -.4rem; min-width: 1.4rem; height: 1.4rem; padding: 0 .3rem; border-radius: 9999px; font-size: .72rem; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }

.demo-strip { background: var(--demo-strip); color: #e2e8f0; }
.line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fade-enter-active, .fade-leave-active { transition: opacity .2s; } .fade-enter-from, .fade-leave-to { opacity: 0; }
.toast-enter-active, .toast-leave-active { transition: all .25s; } .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateY(-8px); }

/* SweetAlert2 con la paleta de la app */
.swal2-popup { font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif !important; border-radius: 1rem !important; }
.swal2-container { z-index: 100 !important; }
.swal2-html-container { font-size: .95rem !important; }
.swal2-select, .swal2-input { font-size: .95rem !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

const COP = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
const NUM = new Intl.NumberFormat('es-CO', { maximumFractionDigits: 1 });
const money = (n) => COP.format(Math.round(Number(n) || 0)).replace(/ /g, ' ');
const num = (n) => NUM.format(Number(n) || 0);
const pct = (n) => (Number(n) || 0).toLocaleString('es-CO', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const pad = (n) => String(n).padStart(2, '0');
const hour12 = (d) => { let hh = d.getHours(); const ap = hh >= 12 ? 'p. m.' : 'a. m.'; hh = hh % 12 || 12; return hh + ':' + pad(d.getMinutes()) + ' ' + ap; };
const fmtDateTime = (ts) => { const d = new Date(ts); return pad(d.getDate()) + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + ', ' + hour12(d); };
const fmtShort = (ts) => { const d = new Date(ts); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ', ' + hour12(d); };
const fmtDay = (ts) => { const d = new Date(ts); return pad(d.getDate()) + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
const isoDay = (ts) => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const dayStart = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
const timeAgo = (ts) => {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return 'hace unos segundos';
  if (s < 3600) return 'hace ' + Math.floor(s / 60) + ' min';
  if (s < 86400) return 'hace ' + Math.floor(s / 3600) + ' h';
  const d = Math.floor(s / 86400); return 'hace ' + d + (d === 1 ? ' día' : ' días');
};
const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const clone = (o) => JSON.parse(JSON.stringify(o));

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const iconCache = {};
const Icon = {
  props: { name: String },
  setup(props) {
    return () => {
      let d = iconCache[props.name];
      if (!d) {
        const def = window.FontAwesome && FontAwesome.findIconDefinition({ prefix: 'fas', iconName: props.name });
        d = def ? def.icon : [512, 512, [], '', 'M256 64a192 192 0 1 0 0 384 192 192 0 1 0 0-384z'];
        iconCache[props.name] = d;
      }
      const path = Array.isArray(d[4]) ? d[4].join(' ') : d[4];
      return h('svg', { class: 'svg-icon', viewBox: '0 0 ' + d[0] + ' ' + d[1], fill: 'currentColor', 'aria-hidden': 'true' }, [h('path', { d: path })]);
    };
  },
};

  const key = p.id + p.name + (bare ? '-bare' : '');
  if (imgCache[key]) return imgCache[key];
  const [upper, accent, sole] = p.colors;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360"><rect width="480" height="360" rx="24" fill="#f4f4f5"/>'
    + (bare ? '' : '<text x="32" y="48" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#71717a">' + esc((p.brand || '').toUpperCase()) + '</text>')
    + '<ellipse cx="245" cy="272" rx="190" ry="10" fill="#000" opacity="0.08"/>'
    + '<path d="M58 236 Q58 262 86 264 L404 264 Q432 262 432 240 L432 228 L58 228 Z" fill="' + sole + '" stroke="#52525b" stroke-opacity="0.35" stroke-width="2"/>'
    + '<path d="M66 230 C60 198 76 170 112 160 L190 132 C214 124 232 106 248 92 L294 92 C302 120 320 140 352 150 L398 166 C426 178 434 204 432 230 Z" fill="' + upper + '" stroke="#3f3f46" stroke-opacity="0.45" stroke-width="2"/>'
    + '<path d="M150 214 C210 198 282 162 336 122 C306 172 244 212 170 228 Z" fill="' + accent + '" opacity="0.92"/>'
    + '<path d="M398 166 C418 152 424 132 418 112 L398 110 C400 130 396 150 388 160 Z" fill="' + accent + '" opacity="0.85"/>'
    + '<g stroke="#a1a1aa" stroke-width="5" stroke-linecap="round"><line x1="168" y1="150" x2="186" y2="162"/><line x1="190" y1="138" x2="208" y2="150"/><line x1="212" y1="124" x2="230" y2="136"/><line x1="232" y1="110" x2="250" y2="122"/></g>'
    + '<line x1="66" y1="232" x2="430" y2="232" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>'
    + (bare ? '' : '<text x="240" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">' + esc(p.name) + '</text>'
    + '<text x="240" y="338" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#71717a">Ref. ' + esc(p.ref || '') + '</text>') + '</svg>';
  return (imgCache[key] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
}

const CONTINGENCY_PREFIX = 'Contingencia sin internet: traslado normal convertido a solicitud por destino local.';
const CLIENT_NAMES = ['Laura Gómez', 'Andrés Rojas', 'Valentina Ríos', 'Santiago Herrera', 'Camila Torres', 'Juan Pablo Díaz', 'Mariana López', 'Sebastián Castro', 'Daniela Moreno', 'Felipe Vargas'];

// ───────────────────────── Generación de datos (historia simulada) ─────────────────────────
function generateData() {
  const rnd = mulberry32(20261002);
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const weighted = (items, w) => { const total = items.reduce((s, i) => s + w(i), 0); let r = rnd() * total; for (const i of items) { r -= w(i); if (r <= 0) return i; } return items[items.length - 1]; };

  const now = Date.now();
  const today0 = new Date(); today0.setHours(0, 0, 0, 0);
  const T0 = today0.getTime();
  const DAY = 86400000;
  const at = (daysAgo, hh, mm = 0) => T0 - daysAgo * DAY + hh * 3600000 + mm * 60000;
  const todayAt = (minsAgo) => now - minsAgo * 60000;

  const D = {
    seq: { sale: 1000, mov: 1, req: 300, ret: 40, notif: 1, user: 10, wh: 10, prod: 100, acc: 10, inv: 1 },
    warehouses: [
      { id: 1, name: 'Bodega Casa (Importaciones)', type: 'bodega_casa', shoe_side: null, address: 'Cra. 00 # 00-01, Zona Industrial', phone: '601 000 0001', is_active: true },
      { id: 2, name: 'Bodega Principal', type: 'bodega_primaria', shoe_side: null, address: 'Cra. 00 # 00-02, Centro Logístico', phone: '601 000 0002', is_active: true },
      { id: 3, name: 'Bodega Abastecimiento Locales', type: 'bodega_locales', shoe_side: null, address: 'Cra. 00 # 00-03, Centro Logístico', phone: '601 000 0003', is_active: true },
      { id: 4, name: 'Local 101 - CC Norte', type: 'local_exhibicion', shoe_side: 'derecho', address: 'Centro Comercial Norte, local 101', phone: '601 000 0004', is_active: true },
      { id: 5, name: 'Local 205 - CC Sur', type: 'local_exhibicion', shoe_side: 'derecho', address: 'Centro Comercial Sur, local 205', phone: '601 000 0005', is_active: true },
      { id: 6, name: 'Local 110 - CC Norte', type: 'local_exhibicion', shoe_side: 'izquierdo', address: 'Centro Comercial Norte, local 110', phone: '601 000 0006', is_active: true },
      { id: 7, name: 'Local 212 - CC Sur', type: 'local_exhibicion', shoe_side: 'izquierdo', address: 'Centro Comercial Sur, local 212', phone: '601 000 0007', is_active: true },
    ],
    users: [
      { id: 1, name: 'Administrador Demo', email: 'admin@demo.com', rol: 'admin', warehouse_id: null, is_active: true },
      { id: 2, name: 'Gerente Demo', email: 'gerente@demo.com', rol: 'manager', warehouse_id: null, is_active: true },
      { id: 3, name: 'Bodeguero Demo', email: 'bodega@demo.com', rol: 'bodega', warehouse_id: 2, is_active: true },
      { id: 4, name: 'Vendedor Norte 101', email: 'vendedor.norte@demo.com', rol: 'vendedor', warehouse_id: 4, is_active: true },
      { id: 5, name: 'Vendedor Sur 205', email: 'vendedor.sur@demo.com', rol: 'vendedor', warehouse_id: 5, is_active: true },
      { id: 6, name: 'Vendedor Norte 110', email: 'vendedor.norte2@demo.com', rol: 'vendedor', warehouse_id: 6, is_active: true },
      { id: 7, name: 'Vendedor Sur 212', email: 'vendedor.sur2@demo.com', rol: 'vendedor', warehouse_id: 7, is_active: true },
    ].map((u) => ({ ...u, permissions: ROLE_PERMS[u.rol].slice() })),
    roles: Object.keys(ROLE_PERMS).sort().map((name) => ({ name, permissions: ROLE_PERMS[name].slice() })),
    accounts: [
      { id: 1, type: 'nequi', account_number: '300 000 0001', owner_name: 'Calzado Demo S.A.S.', is_active: true, active_from: isoDay(now - 120 * DAY), active_until: null, limit_amount: null, notes: 'Cuenta ficticia de demostración' },
      { id: 2, type: 'bancolombia', account_number: '000-000000-01', owner_name: 'Calzado Demo S.A.S.', is_active: true, active_from: isoDay(now - 120 * DAY), active_until: null, limit_amount: null, notes: 'Cuenta ficticia de demostración' },
      { id: 3, type: 'daviplata', account_number: '310 000 0002', owner_name: 'Calzado Demo S.A.S.', is_active: true, active_from: isoDay(now - 120 * DAY), active_until: null, limit_amount: 15000000, notes: 'Cuenta ficticia de demostración' },
      { id: 4, type: 'llave_bancolombia', account_number: '@calzadodemo', owner_name: 'Calzado Demo S.A.S.', is_active: true, active_from: isoDay(now - 120 * DAY), active_until: null, limit_amount: null, notes: 'Cuenta ficticia de demostración' },
      { id: 5, type: 'nequi', account_number: '300 000 0003', owner_name: 'Cuenta anterior', is_active: false, active_from: isoDay(now - 90 * DAY), active_until: isoDay(now - 80 * DAY), limit_amount: null, notes: 'Cuenta ficticia de demostración' },
    ],
    products: [], inventory: [], sales: [], movements: [], requests: [], returns: [], notifications: [],
    queues: { sales: [], transfers: [] },
    pos: {},
  };

  const addProduct = (row, created) => {
    const [name, brand, ref, price, cost, pop, colors] = row;
    const p = { id: D.products.length + 1, name, brand, ref, price, cost, pop, colors, is_active: true, created_at: created, image: null };
    D.products.push(p);
    return p;
  };
  CATALOG.forEach((r) => addProduct(r, at(75, 7)));
  const arrivals = NEW_ARRIVALS.map((r) => addProduct(r, at(12, 7, 30)));
  D.seq.prod = D.products.length + 1;

  const inv = {};
  const setInv = (w, p, s, stock, cost) => { const k = w + '|' + p + '|' + s; if (!inv[k]) inv[k] = { id: D.seq.inv++, w, p, s, stock: 0, min: w <= 3 ? 1 : 0, cost }; inv[k].stock = stock; inv[k].cost = cost; };
  const curve = { 36: 1, 37: 2, 38: 3, 39: 3, 40: 3, 41: 3, 42: 3, 43: 2, 44: 1 };

  // Estado final de bodegas: lotes importados menos lo que ya salió en 60 días
  D.products.forEach((p, i) => {
    if (arrivals.includes(p)) {
      [[37, 2], [38, 3], [39, 2], [40, 3], [41, 3], [42, 2]].forEach(([s, q]) => setInv(2, p.id, s, q, p.cost));
      return;
    }
    const wear = i % 9 === 4 ? 0.18 : i % 11 === 7 ? 0.25 : 0.45 + rnd() * 0.5;
    SIZES.forEach((s) => {
      const base = curve[s] * (p.pop + 1);
      setInv(1, p.id, s, Math.max(0, Math.round(base * 0.25 - rnd())), p.cost);
      setInv(2, p.id, s, Math.max(0, Math.round(base * 0.75 * wear - rnd() * 1.2)), p.cost);
      if ([38, 40, 41].includes(s)) setInv(3, p.id, s, rnd() < 0.55 ? 1 : 0, p.cost);
    });
  });

  // Vitrina: cada modelo muestra una talla dama y una caballero por par de locales
  const exhibited = {}; // 'pairIdx|p' -> [sizes]
  CATALOG.forEach((_, index) => {
    const pid = index + 1;
    PAIRS.forEach(([r, l], pi) => {
      if (index % 7 === 3 + pi) return;
      const dama = [37, 38][(index + pi) % 2];
      const cab = [40, 41, 42][(index + pi) % 3];
      exhibited[pi + '|' + pid] = [dama, cab];
      [dama, cab].forEach((s) => { setInv(r, pid, s, 1, D.products[pid - 1].cost); setInv(l, pid, s, 1, D.products[pid - 1].cost); });
    });
  });

  const sellerOf = { 4: 4, 5: 5, 6: 6, 7: 7 };
  const accIds = D.accounts.filter((a) => a.is_active);
  const payment = () => {
    const m = weighted(['efectivo', 'tarjeta', 'account'], (x) => ({ efectivo: 40, tarjeta: 15, account: 45 }[x]));
    if (m !== 'account') return { payment_method: m, payment_account_id: null };
    const a = pick(accIds); return { payment_method: a.type, payment_account_id: a.id };
  };
  const mov = (o) => { const m = { id: D.seq.mov++, observations: '', ...o }; D.movements.push(m); return m; };
  const notify = (o) => D.notifications.push({ id: D.seq.notif++, is_read: false, ...o });
  const whName = (id) => D.warehouses.find((w) => w.id === id).name;
  const pname = (id) => D.products[id - 1].name;

  // Historia de inventario: compras, ingresos y montaje de vitrina
  const brands = [...new Set(CATALOG.map((r) => r[1]))];
  brands.forEach((b, bi) => {
    const prods = D.products.filter((p) => p.brand === b && !arrivals.includes(p));
    mov({ type: 'purchase', origin: null, dest: 1, user: 1, date: at(75, 9, bi * 4), observations: 'Importación ' + b + ' - lote inicial', items: prods.flatMap((p) => SIZES.map((s) => ({ p: p.id, s, q: curve[s] * (p.pop + 1), cost: p.cost }))) });
  });
  brands.forEach((b, bi) => {
    const prods = D.products.filter((p) => p.brand === b && !arrivals.includes(p));
    mov({ type: 'transfer', origin: 1, dest: 2, user: 3, date: at(74, 10, bi * 3), observations: 'Ingreso a bodega principal ' + b, items: prods.flatMap((p) => SIZES.map((s) => ({ p: p.id, s, q: Math.ceil(curve[s] * (p.pop + 1) * 0.75), cost: p.cost }))) });
  });
  mov({ type: 'transfer', origin: 2, dest: 3, user: 3, date: at(73, 10), observations: 'Surtido inicial bodega de locales', items: CATALOG.flatMap((_, i) => [38, 40, 41].map((s) => ({ p: i + 1, s, q: 1, cost: D.products[i].cost }))) });
  Object.entries(exhibited).forEach(([k, sizes], n) => {
    const [pi, pid] = k.split('|').map(Number);
    const [r, l] = PAIRS[pi];
    sizes.forEach((s, j) => {
      mov({ type: 'transfer', origin: 2, dest: r, user: 3, date: at(72, 9, n * 2 + j), observations: 'Montaje de vitrina [Exhibición: derecho en ' + whName(r) + ']', items: [{ p: pid, s, q: 1, cost: D.products[pid - 1].cost }] });
      mov({ type: 'transfer', origin: 2, dest: l, user: 3, date: at(72, 9, n * 2 + j), observations: 'Montaje de vitrina [Exhibición: izquierdo en ' + whName(l) + ']', items: [{ p: pid, s, q: 1, cost: D.products[pid - 1].cost }] });
    });
  });
  const top = D.products.filter((p) => p.pop >= 2 && !arrivals.includes(p));
  mov({ type: 'purchase', origin: null, dest: 1, user: 1, date: at(30, 8), observations: 'Reposición de referencias más vendidas', items: top.flatMap((p) => SIZES.map((s) => ({ p: p.id, s, q: curve[s], cost: Math.round(p.cost * 1.05 / 1000) * 1000 }))) });
  mov({ type: 'transfer', origin: 1, dest: 2, user: 3, date: at(30, 8, 20), observations: 'Ingreso reposición a bodega principal', items: top.flatMap((p) => SIZES.map((s) => ({ p: p.id, s, q: curve[s], cost: p.cost }))) });
  mov({ type: 'purchase', origin: null, dest: 2, user: 1, date: at(12, 8), observations: 'Nuevas referencias temporada', items: arrivals.flatMap((p) => [[37, 2], [38, 3], [39, 2], [40, 3], [41, 3], [42, 2]].map(([s, q]) => ({ p: p.id, s, q, cost: p.cost }))) });

  // Simulación diaria de ventas, solicitudes y reposiciones
  const pairSizes = (local, pid) => exhibited[(local === 4 || local === 6 ? 0 : 1) + '|' + pid] || [];
  for (let d = 60; d >= 0; d--) {
    const isToday = d === 0;
    const date = new Date(T0 - d * DAY);
    const weekend = date.getDay() === 0 || date.getDay() === 6;
    const n = isToday ? 2 : weekend ? ri(5, 8) : ri(2, 5);
    for (let i = 0; i < n; i++) {
      const local = pick([4, 5, 6, 7]);
      const partner = PARTNER[local];
      const options = CATALOG.map((_, idx) => idx + 1).filter((pid) => pairSizes(local, pid).length);
      const pid = weighted(options, (x) => D.products[x - 1].pop);
      const size = pick(pairSizes(local, pid));
      const p = D.products[pid - 1];
      const price = rnd() < 0.2 ? Math.round(p.price * 0.9 / 1000) * 1000 : p.price;
      const ts = isToday ? todayAt(150 - i * 70) : at(d, 10 + i, ri(0, 50));
      const right = D.warehouses.find((w) => w.id === local).shoe_side === 'derecho' ? local : partner;
      const left = PARTNER[right];
      const sale = { id: D.seq.sale++, date: ts, warehouse_id: local, user_id: sellerOf[local], ...payment(), status: 'completed', observations: 'Venta de exhibición', items: [{ p: pid, s: size, q: 1, price, cost: p.cost, exhibition: true }] };
      sale.total = price;
      D.sales.push(sale);
      mov({ type: 'exhibition_sale', origin: local, dest: null, user: sellerOf[local], date: ts, observations: 'Venta de exhibición (0.5 par en ' + whName(right) + ' + 0.5 par en ' + whName(left) + ')', items: [{ p: pid, s: size, q: 1, cost: p.cost }] });
      const req = { id: D.seq.req++, type: 'exhibition_replenishment', status: 'pending', requester_user: sellerOf[right], local: right, source: null, prepared_by: null, client: null, notes: null, created_at: ts + 60000, prepared_at: null, delivered_at: null, closed_at: null,
        items: [{ p: pid, s: size, q: 1, sold_size: size, sale_id: sale.id }], pair: { right, left } };
      if (!isToday && !(d === 1 && i === 0)) {
        const src = pick([2, 3]);
        Object.assign(req, { status: 'delivered', source: src, prepared_by: 3, prepared_at: at(d - 1, 8, 30), delivered_at: at(d - 1, 8, 45), closed_at: at(d - 1, 8, 45) });
        mov({ type: 'replenishment', origin: src, dest: right, user: 3, date: at(d - 1, 8, 45), observations: 'Reposición de exhibición: par en ' + whName(right) + ' y ' + whName(left), items: [{ p: pid, s: size, q: 1, cost: p.cost }] });
      } else {
        // Pendiente hoy: el par vendido ya no está en vitrina
        setInv(right, pid, size, 0, p.cost); setInv(left, pid, size, 0, p.cost);
        if (d === 1) Object.assign(req, { status: 'prepared', source: 2, prepared_by: 3, prepared_at: at(0, 8, 30), items: [{ ...req.items[0], s: size }] });
        notify({ user_role: 'bodega', type: 'warning', kind: 'exhibition_replenishment', ref: req.id, title: '👟 Reposición de exhibición requerida', message: 'Se vendió el par de exhibición: ' + p.name + ' talla ' + size + '. Reponer en: ' + whName(right) + ' (derecho) y ' + whName(left) + ' (izquierdo).', created_at: ts + 60000, actor: D.users[sellerOf[local] - 1].name, local: whName(local) });
      }
      D.requests.push(req);
    }

    // Solicitud de cliente por una talla que no está en vitrina (días pares)
    if (d % 2 === 0) {
      const local = pick([4, 5, 6, 7]);
      const p = D.products[ri(0, CATALOG.length - 1)];
      const size = pick(SIZES);
      const ts = isToday ? todayAt(25) : at(d, 12, ri(0, 59));
      const client = pick(CLIENT_NAMES);
      const req = { id: D.seq.req++, type: 'product_request', status: 'pending', requester_user: sellerOf[local], local, source: null, prepared_by: null, client, notes: 'Cliente espera en el local', created_at: ts, prepared_at: null, delivered_at: null, closed_at: null, items: [{ p: p.id, s: size, q: 1 }] };
      D.requests.push(req);
      if (isToday) {
        notify({ user_role: 'bodega', type: 'warning', kind: 'product_request', ref: req.id, title: '📦 Nueva solicitud de productos', message: 'El local "' + whName(local) + '" necesita: 1x ' + p.name + ' (' + size + ') — Cliente: ' + client + '.', created_at: ts, actor: D.users[sellerOf[local] - 1].name, local: whName(local) });
        continue;
      }
      Object.assign(req, { source: 2, prepared_by: 3, prepared_at: ts + 10 * 60000, delivered_at: ts + 35 * 60000 });
      mov({ type: 'transfer', origin: 2, dest: local, user: 3, date: ts + 35 * 60000, observations: 'Solicitud #' + req.id + ' entregada al local', items: [{ p: p.id, s: size, q: 1, cost: p.cost }] });
      if (rnd() < 0.15) {
        req.status = 'returned'; req.closed_at = ts + 55 * 60000;
        const ret = { id: D.seq.ret++, request_id: req.id, local, dest: 2, user: sellerOf[local], reason: 'El cliente no se llevó el producto', status: 'received', created_at: ts + 55 * 60000, received_at: at(d - 1, 8, 40), items: [{ p: p.id, s: size, q: 1 }] };
        D.returns.push(ret);
        mov({ type: 'no_sale_return', origin: local, dest: 2, user: 3, date: ret.received_at, observations: 'Devolución sin venta - ' + ret.reason, items: [{ p: p.id, s: size, q: 1, cost: p.cost }] });
      } else {
        req.status = 'completed'; req.closed_at = ts + 55 * 60000;
        const sale = { id: D.seq.sale++, date: ts + 55 * 60000, warehouse_id: local, user_id: sellerOf[local], ...payment(), status: 'completed', observations: 'Venta por solicitud #' + req.id, request_id: req.id, items: [{ p: p.id, s: size, q: 1, price: p.price, cost: p.cost }] };
        sale.total = p.price; D.sales.push(sale);
        mov({ type: 'sale', origin: local, dest: null, user: sellerOf[local], date: sale.date, observations: 'Venta #' + sale.id, items: [{ p: p.id, s: size, q: 1, cost: p.cost }] });
      }
    }

    // Venta mayorista del administrador desde Bodega Principal

const P = (id) => S.products.find((p) => p.id === Number(id));
const U = (id) => S.users.find((u) => u.id === Number(id));
const wName = (id) => (W(id) ? W(id).name : '-');

const isLocal = (id) => String((W(id) || {}).type || '').startsWith('local');

const effective = (wid, stock) => (isLocal(wid) ? stock * 0.5 : stock);

const bodegas = computed(() => S.warehouses.filter((w) => w.type.startsWith('bodega')));
const pairOf = (local) => { const partner = PARTNER[local]; if (!partner) return null; const right = W(local).shoe_side === 'derecho' ? local : partner; return { right, left: PARTNER[right] }; };

const invRow = (w, p, s) => S.inventory.find((r) => r.w === Number(w) && r.p === Number(p) && r.s === Number(s));
const stockOf = (w, p, s) => { const r = invRow(w, p, s); return r ? r.stock : 0; };
function addStock(w, p, s, q, cost) {
  let r = invRow(w, p, s);
  if (!r) { r = { id: S.seq.inv++, w: Number(w), p: Number(p), s: Number(s), stock: 0, min: isBodegaW(w) ? 1 : 0, cost: cost || (P(p) || {}).cost || 0 }; S.inventory.push(r); }
  r.stock += q; if (cost) r.cost = cost;
  return r;
}
function takeStock(w, p, s, q) { const r = invRow(w, p, s); if (!r || r.stock < q) return false; r.stock -= q; return true; }
const REQUEST_BODEGAS = [2, 3];
const bodegaStock = (p, s) => REQUEST_BODEGAS.reduce((t, w) => t + stockOf(w, p, s), 0);
const pairFull = (pair, p, s) => stockOf(pair.right, p, s) > 0 && stockOf(pair.left, p, s) > 0;

function mov(o) { const m = { id: S.seq.mov++, user: UI.userId, date: Date.now(), observations: '', ...o }; S.movements.unshift(m); return m; }

const myNotifications = computed(() => {

});

function sourceOptions(req) {
  return REQUEST_BODEGAS.map((w) => ({ id: w, name: wName(w), is_main: w === MAIN_WAREHOUSE, ok: req.items.every((it) => stockOf(w, it.p, it.s) >= it.q), stock: req.items.reduce((t, it) => t + stockOf(w, it.p, it.s), 0) })).filter((o) => o.ok);
}
function prepareRequest(req, sourceId, sizeOverride) {
  if (sizeOverride) req.items[0].s = Number(sizeOverride);
  req.status = 'prepared'; req.source = Number(sourceId); req.prepared_by = UI.userId; req.prepared_at = Date.now();
  if (req.type === 'exhibition_replenishment') {
    notify({ user_id: req.requester_user, type: 'success', kind: 'exhibition_replenishment', ref: req.id, title: '📦 Reposición de exhibición preparada', message: pName(req.items[0].p) + ' talla ' + req.items[0].s + ' lista en "' + wName(req.source) + '".', local: wName(req.local) });
  } else if (req.type === 'product_request') {
    notify({ user_id: req.requester_user, type: 'success', kind: 'product_request_ready', ref: req.id, title: '✅ Productos preparados', message: 'Los productos están listos en "' + wName(req.source) + '". El bodeguero va en camino al local.', local: wName(req.local) });
  }
}
function deliverRequest(req) {
  if (req.type === 'exhibition_replenishment') {
    const it = req.items[0];
    if (!takeStock(req.source, it.p, it.s, 1)) return 'No hay stock en la bodega origen para esa talla.';
    const set = (w) => { const r = addStock(w, it.p, it.s, 0, P(it.p).cost); r.stock = 1; };
    set(req.pair.right); set(req.pair.left);
    mov({ type: 'replenishment', origin: req.source, dest: req.pair.right, observations: 'Reposición de exhibición: par en ' + wName(req.pair.right) + ' y ' + wName(req.pair.left), items: [{ p: it.p, s: it.s, q: 1, cost: P(it.p).cost }] });
    req.status = 'delivered'; req.delivered_at = req.closed_at = Date.now();
    notify({ user_id: req.requester_user, type: 'success', kind: 'exhibition_replenishment', ref: req.id, title: '👟 Reposición de exhibición entregada', message: 'Se repuso el par de exhibición en ' + wName(req.pair.right) + ' (derecho) y ' + wName(req.pair.left) + ' (izquierdo).', local: wName(req.local) });
    return null;
  }
  for (const it of req.items) if (stockOf(req.source, it.p, it.s) < it.q) return 'Stock insuficiente en "' + wName(req.source) + '" para ' + pName(it.p) + ' talla ' + it.s + '.';
  req.items.forEach((it) => { takeStock(req.source, it.p, it.s, it.q); addStock(req.local, it.p, it.s, it.q * 2); });
  if (req.type === 'size_exchange') {
    (req.old_items || []).forEach((it) => { takeStock(req.local, it.p, it.s, it.q * 2); addStock(req.source, it.p, it.s, it.q); });
    req.status = 'completed'; req.delivered_at = req.closed_at = Date.now();
    mov({ type: 'transfer', origin: req.source, dest: req.local, observations: 'Cambio de talla #' + req.id, items: req.items.map((it) => ({ p: it.p, s: it.s, q: it.q, cost: P(it.p).cost })) });
    notify({ user_id: req.requester_user, type: 'success', kind: 'size_exchange_delivered', ref: req.id, title: '🔄 Cambio de talla completado', message: 'El bodeguero entregó la talla ' + req.items[0].s + ' en "' + wName(req.local) + '". Recogió la talla ' + ((req.old_items || [])[0] || {}).s + '.', local: wName(req.local) });
    return null;
  }
  req.status = 'delivered'; req.delivered_at = Date.now();
  mov({ type: 'transfer', origin: req.source, dest: req.local, observations: 'Solicitud #' + req.id + ' entregada al local', items: req.items.map((it) => ({ p: it.p, s: it.s, q: it.q, cost: P(it.p).cost })) });
  notify({ user_id: req.requester_user, type: 'success', kind: 'product_request_delivered', ref: req.id, title: '🚀 Productos entregados en el local', message: 'Los productos ya están en "' + wName(req.local) + '". Puedes registrar la venta en el POS.', local: wName(req.local) });
  return null;
}
function cancelRequest(req, reason) {
  if (req.status === 'delivered' && req.type === 'product_request') req.items.forEach((it) => { if (takeStock(req.local, it.p, it.s, it.q * 2)) addStock(MAIN_WAREHOUSE, it.p, it.s, it.q); });
  req.status = 'cancelled'; req.closed_at = Date.now(); if (reason) req.notes = (req.notes ? req.notes + ' | ' : '') + 'Quitada: ' + reason;
}
function receiveReturn(ret) {
  ret.items.forEach((it) => { if (takeStock(ret.local, it.p, it.s, it.q * 2)) addStock(ret.dest, it.p, it.s, it.q); });
  ret.status = 'received'; ret.received_at = Date.now();
  mov({ type: 'no_sale_return', origin: ret.local, dest: ret.dest, observations: 'Devolución sin venta - ' + (ret.reason || 'sin motivo'), items: ret.items.map((it) => ({ p: it.p, s: it.s, q: it.q, cost: P(it.p).cost })) });
  notify({ user_id: ret.user, type: 'info', kind: 'return_request', ref: ret.request_id, title: '✔️ Devolución completada', message: 'El bodeguero recibió los productos devueltos en "' + wName(ret.dest) + '". El inventario fue actualizado.', local: wName(ret.local) });
}

function registerSale({ local, items, payment_method, payment_account_id, observations }) {
  const sale = { id: S.seq.sale++, date: Date.now(), warehouse_id: Number(local), user_id: UI.userId, payment_method, payment_account_id: payment_account_id || null, status: 'completed', observations: observations || '', items: [] };
  for (const it of items) {
    const p = P(it.p);
    if (it.exhibition) {
      const pair = it.pair || pairOf(local);
      takeStock(pair.right, it.p, it.s, 1); takeStock(pair.left, it.p, it.s, 1);
      sale.items.push({ p: it.p, s: it.s, q: 1, price: it.price, cost: p.cost, exhibition: true });
      mov({ type: 'exhibition_sale', origin: Number(local), dest: null, observations: 'Venta de exhibición (0.5 par en ' + wName(pair.right) + ' + 0.5 par en ' + wName(pair.left) + ')', items: [{ p: it.p, s: it.s, q: 1, cost: p.cost }] });
      if (SIZES.some((s) => genderOf(s) === genderOf(it.s) && bodegaStock(it.p, s) > 0)) {
        const req = { id: S.seq.req++, type: 'exhibition_replenishment', status: 'pending', requester_user: UI.userId, local: pair.right, source: null, prepared_by: null, client: null, notes: null, created_at: Date.now(), prepared_at: null, delivered_at: null, closed_at: null, items: [{ p: it.p, s: it.s, q: 1, sold_size: it.s, sale_id: sale.id }], pair };
        S.requests.unshift(req);
        notify({ user_role: 'bodega', type: 'warning', kind: 'exhibition_replenishment', ref: req.id, title: '👟 Reposición de exhibición requerida', message: 'Se vendió el par de exhibición: ' + p.name + ' talla ' + it.s + '. Reponer en: ' + wName(pair.right) + ' (derecho) y ' + wName(pair.left) + ' (izquierdo). Stock total disponible del producto en bodega: ' + SIZES.reduce((t, s) => t + bodegaStock(it.p, s), 0) + ' par(es).', local: wName(local) });
      } else {
        notify({ user_role: 'admin', type: 'warning', kind: 'exhibition_replenishment', ref: null, title: '⚠️ Producto sin stock para reposición de exhibición', message: p.name + ' talla ' + it.s + ' no tiene tallas de ' + genderLabel(it.s) + ' en bodegas.', local: wName(local) });
      }
    } else {
      const src = it.req_id ? Number(local) : Number(it.from || local);
      const qty = isLocal(src) ? it.q * 2 : it.q;
      takeStock(src, it.p, it.s, qty);
      sale.items.push({ p: it.p, s: it.s, q: it.q, price: it.price, cost: p.cost });
      mov({ type: 'sale', origin: src, dest: null, observations: 'Venta #' + sale.id, items: [{ p: it.p, s: it.s, q: it.q, cost: p.cost }] });
      if (it.req_id) { const r = S.requests.find((x) => x.id === it.req_id); if (r) { r.status = 'completed'; r.closed_at = Date.now(); } sale.request_id = it.req_id; }
    }
  }
  sale.total = sale.items.reduce((t, it) => t + it.q * it.price, 0);
  S.sales.unshift(sale);
  return sale;
}
function deleteSaleItems(sale, idxs) {
  const keep = [];
  sale.items.forEach((it, i) => {
    if (!idxs.includes(i)) { keep.push(it); return; }
    if (it.exhibition) { const pair = pairOf(sale.warehouse_id); if (pair) { addStock(pair.right, it.p, it.s, 1); addStock(pair.left, it.p, it.s, 1); } }
    else addStock(sale.warehouse_id, it.p, it.s, isLocal(sale.warehouse_id) ? it.q * 2 : it.q);
  });
  sale.items = keep; sale.total = keep.reduce((t, it) => t + it.q * it.price, 0);
  if (!keep.length) S.sales.splice(S.sales.indexOf(sale), 1);
}

// Cuentas de pago: recibido y disponibilidad
const accountReceived = (id) => S.sales.filter((s) => s.payment_account_id === id).reduce((t, s) => t + s.total, 0);
function accountStatus(a) {
  const today = isoDay(Date.now());
  if (!a.is_active) return { label: 'Inactiva', cls: 'bg-gray-100 text-gray-500', ok: false };
  if (a.active_until && a.active_until < today) return { label: 'Vencida', cls: 'bg-red-100 text-red-700', ok: false };
  if (a.active_from && a.active_from > today) return { label: 'Próximamente', cls: 'bg-yellow-100 text-yellow-700', ok: false };
  if (a.limit_amount && accountReceived(a.id) >= a.limit_amount) return { label: 'Tope alcanzado', cls: 'bg-orange-100 text-orange-700', ok: false };
  return { label: 'Disponible', cls: 'bg-green-100 text-green-800', ok: true };
}

const OfflineIndicator = {
  computed: {
    pending() { return S.queues.sales.length + S.queues.transfers.length; },
    state() {
      if (UI.offline) return { label: 'Sin internet', cls: 'border-rose-300 bg-rose-50 text-rose-700', dot: 'bg-rose-500' };
      if (UI.reconnecting) return { label: 'Reconectando', cls: 'border-amber-300 bg-amber-50 text-amber-700', dot: 'bg-amber-500' };
      if (this.pending) return { label: 'En linea con pendientes', cls: 'border-cyan-300 bg-cyan-50 text-cyan-700', dot: 'bg-cyan-500' };
      return { label: 'En linea', cls: 'border-emerald-300 bg-emerald-50 text-emerald-700', dot: 'bg-emerald-500' };
    },
  },
  methods: {
    async toggle() {
      if (!UI.offline) {
        const r = await Alert.fire({ icon: 'question', title: 'Simular sin internet', html: 'La app sigue funcionando sin conexión: las ventas y traslados se guardan en el dispositivo y se sincronizan solos al volver el internet.<br><br>¿Quieres simular que se cayó el internet?', showCancelButton: true, confirmButtonText: 'Sí, simular', cancelButtonText: 'Cancelar' });
        if (r.isConfirmed) UI.offline = true;
        return;
      }
      UI.offline = false; UI.reconnecting = true;
      setTimeout(() => {
        UI.reconnecting = false;
        const n = S.queues.sales.length; const t = S.queues.transfers.length;
        S.queues.sales.splice(0).forEach((q) => { const prev = UI.userId; UI.userId = q.user; registerSale(q.payload); UI.userId = prev; });
        S.queues.transfers.splice(0).forEach((q) => { const prev = UI.userId; UI.userId = q.user; doTransfer(q.payload); UI.userId = prev; });
        if (n || t) Alert.fire({ icon: 'success', title: 'Sincronización completa', html: 'Pendientes iniciales: <b>' + (n + t) + '</b><br>Ventas sincronizadas: <b>' + n + '</b><br>Traslados sincronizados: <b>' + t + '</b><br>Pendientes restantes: <b>0</b>' });
      }, 2500);
    },
  },
  template: `<button class="inline-flex items-center gap-2 rounded-xl border px-2.5 py-1.5 text-xs font-semibold" :class="state.cls" @click="toggle" :title="'Pendientes: Ventas ' + S.queues.sales.length + ', Traslados ' + S.queues.transfers.length + ' · Toca para simular ' + (UI.offline ? 'que volvió' : 'sin') + ' internet'">
    <span class="h-2 w-2 rounded-full" :class="[state.dot, UI.reconnecting ? 'animate-pulse' : '']"></span><span class="hidden sm:inline">{{ state.label }}</span>
    <span v-if="pending" class="rounded-full bg-white px-1.5 text-[10px] font-bold">{{ pending }}</span></button>`,
};

function openNotification(n) {
  n.is_read = true;
  const req = S.requests.find((r) => r.id === n.ref);
  const closed = req && ['completed', 'cancelled', 'returned'].includes(req.status);
  if (closed) return go('solicitudes-historial');
  if (['product_request_ready', 'product_request_delivered', 'size_exchange_delivered'].includes(n.kind) && canSee('pos')) return go('pos', { openSolicitudes: true });
  if (canSee('transfers') && ['product_request', 'size_exchange_request', 'exhibition_replenishment', 'return_request'].includes(n.kind)) { go('transfers'); UI.solicitudesOpen = true; return; }
  go('notifications');
}

const PALETTE = ['#112a4e', '#3b82f6', '#22c55e', '#f59e0b', '#a855f7', '#06b6d4', '#ef4444', '#64748b'];
const Donut = {
  props: { title: String, subtitle: String, chip: String, segments: Array, center: String, caption: String, empty: String, fmt: { type: Function, default: (v) => num(v) } },
  computed: {
    total() { return this.segments.reduce((t, s) => t + s.value, 0); },
    gradient() { let acc = 0; const parts = this.segments.map((s, i) => { const a = acc / this.total * 360; acc += s.value; const b = acc / this.total * 360; return PALETTE[i % PALETTE.length] + ' ' + a + 'deg ' + b + 'deg'; }); return 'conic-gradient(' + parts.join(',') + ')'; },
  },
  template: `
  <div class="card-hover p-4 min-w-0">
    <div class="flex items-start justify-between gap-2"><div><h3 class="font-semibold text-slate-800">{{ title }}</h3><p class="text-xs text-slate-500">{{ subtitle }}</p></div><span v-if="chip" class="brand-chip">{{ chip }}</span></div>
    <div v-if="total > 0" class="mt-4 flex flex-col items-center gap-4">
      <div class="donut" :style="{ background: gradient }"><div class="donut-hole"><span class="text-sm font-semibold text-slate-800 tnum">{{ center }}</span><span class="text-[11px] text-gray-500">{{ caption }}</span></div></div>
      <ul class="w-full max-h-52 overflow-y-auto space-y-1.5 text-sm">
        <li v-for="(s, i) in segments" :key="s.label" class="flex items-center justify-between gap-2"><span class="flex min-w-0 items-center gap-2"><span class="h-2.5 w-2.5 shrink-0 rounded-full" :style="{ background: PALETTE[i % PALETTE.length] }"></span><span class="truncate text-slate-700">{{ s.label }}</span></span>
          <span class="shrink-0 tnum"><b class="text-slate-800">{{ fmt(s.value) }}</b> <span class="text-xs text-gray-500">{{ pct(s.value / total * 100) }}</span></span></li>
      </ul>
    </div>
    <p v-else class="py-10 text-center text-sm text-slate-400">{{ empty }}</p>
  </div>`,
};

const DashboardPage = {
  data() { return { tab: 'resumen', scope: 'all', location: '', range: '7', from: isoDay(Date.now() - 6 * 86400000), to: isoDay(Date.now()) }; },
  computed: {
    tabs() { return [['resumen', 'Resumen'], ['graficas', 'Gráficas'], ['top', 'Top vendidos'], ['stock', 'Bajo stock'], ['todo', 'Todo']]; },
    scopeWarehouses() { return S.warehouses.filter((w) => this.scope === 'all' || (this.scope === 'bodegas' ? w.type.startsWith('bodega') : w.type.startsWith('local'))); },
    period() {
      if (this.range === 'custom') return { a: dayStart(this.from), b: dayStart(this.to) + 86400000 - 1 };
      const d = Number(this.range); const t = new Date(); t.setHours(0, 0, 0, 0);
      return { a: t.getTime() - (d - 1) * 86400000, b: Date.now() };
    },
    whFilter() { return this.location ? [Number(this.location)] : this.scopeWarehouses.map((w) => w.id); },
    sales() { const { a, b } = this.period; return S.sales.filter((s) => s.date >= a && s.date <= b && this.whFilter.includes(s.warehouse_id)); },
    kpi() {
      const total = this.sales.reduce((t, s) => t + s.total, 0);
      const profit = this.sales.reduce((t, s) => t + s.items.reduce((x, it) => x + (it.price - it.cost) * it.q, 0), 0);
      const rows = S.inventory.filter((r) => this.whFilter.includes(r.w) && r.stock > 0);
      const stock = rows.reduce((t, r) => t + effective(r.w, r.stock), 0);
      const value = rows.reduce((t, r) => t + effective(r.w, r.stock) * r.cost, 0);
      return { total, count: this.sales.length, profit, margin: total ? profit / total * 100 : 0, ticket: this.sales.length ? total / this.sales.length : 0, stock, value };
    },
    stockCaption() { if (this.location) return 'stock en ' + wName(this.location); return { all: 'inventario total (bodegas + locales)', bodegas: 'solo inventario en bodegas', locales: 'solo inventario en locales' }[this.scope]; },

        { label: 'Ventas del período', value: money(k.total), caption: k.count + ' ventas', icon: 'cash-register', tile: 'bg-yellow-100 text-yellow-700' },
        { label: 'Ganancia estimada', value: money(k.profit), caption: 'acumulada del período', icon: 'coins', tile: 'bg-lime-100 text-lime-700' },
        { label: 'Margen de ganancia', value: pct(k.margin), caption: 'utilidad sobre ventas', icon: 'tags', tile: 'bg-emerald-100 text-emerald-700' },
        { label: 'Ticket promedio', value: money(k.ticket), caption: 'por venta del período', icon: 'coins', tile: 'bg-sky-100 text-sky-700' },
        { label: 'Stock total (uds)', value: num(k.stock), caption: this.stockCaption, icon: 'warehouse', tile: 'bg-indigo-100 text-indigo-700' },
        { label: 'Valor inventario (costo)', value: money(k.value), caption: 'stock × costo unitario', icon: 'wallet', tile: 'bg-amber-100 text-amber-700' },
      ];
    },
    salesByDay() {
      const m = {}; this.sales.forEach((s) => { const d = new Date(s.date); const k = pad(d.getDate()) + '/' + pad(d.getMonth() + 1); m[k] = (m[k] || 0) + s.total; });
      const arr = Object.entries(m).map(([label, value]) => ({ label, value }));
      return this.limit(arr.reverse(), 7);
    },
    productShare() {
      const m = {}; S.inventory.filter((r) => this.whFilter.includes(r.w) && r.stock > 0).forEach((r) => { m[r.p] = (m[r.p] || 0) + effective(r.w, r.stock); });
      return this.limit(Object.entries(m).map(([p, value]) => ({ label: pName(p), value })).sort((a, b) => b.value - a.value), 5);
    },
    whShare() {
      const m = {}; S.inventory.filter((r) => this.whFilter.includes(r.w) && r.stock > 0).forEach((r) => { m[r.w] = (m[r.w] || 0) + effective(r.w, r.stock); });
      return this.limit(Object.entries(m).map(([w, value]) => ({ label: wName(w), value })).sort((a, b) => b.value - a.value), 6);
    },
    topSold() {
      const m = {}; this.sales.forEach((s) => s.items.forEach((it) => { m[it.p] = m[it.p] || { p: it.p, q: 0, rev: 0 }; m[it.p].q += it.q; m[it.p].rev += it.q * it.price; }));
      return Object.values(m).sort((a, b) => b.q - a.q || b.rev - a.rev).slice(0, 8);
    },
    lowStock() {
      const m = {};
      S.inventory.filter((r) => isBodegaW(r.w) && this.whFilter.includes(r.w)).forEach((r) => { const k = r.p; m[k] = m[k] || { p: r.p, stock: 0, min: 0, whs: new Set() }; m[k].stock += r.stock; m[k].min += r.min; m[k].whs.add(r.w); });
      return Object.values(m).filter((x) => x.stock <= x.min).map((x) => ({ ...x, deficit: x.min - x.stock, whs: [...x.whs].map(wName).join(', ') })).sort((a, b) => b.deficit - a.deficit).slice(0, 12);
    },
    show() { const t = this.tab; return { resumen: t === 'resumen' || t === 'todo', graficas: t === 'graficas' || t === 'todo', top: t === 'top' || t === 'todo', stock: t === 'stock' || t === 'todo' }; },
  },
  watch: { scope() { this.location = ''; } },
  methods: {
    limit(arr, n) { if (arr.length <= n) return arr; const head = arr.slice(0, n); head.push({ label: 'Otros', value: arr.slice(n).reduce((t, x) => t + x.value, 0) }); return head; },
    clear() { Object.assign(this, { scope: 'all', location: '', range: '7' }); },
  },

const UsersPage = {
  data() { return { page: 1, modal: null, form: {}, showPass: false, newRole: '', newRolePerms: [] }; },
  computed: {
    pages() { return Math.max(1, Math.ceil(S.users.length / 10)); },
    rows() { return S.users.slice((this.page - 1) * 10, this.page * 10); },
    ALL() { return ALL_PERMS; },
  },
  methods: {
    open(u) { this.form = u ? { ...clone(u), password: '' } : { name: '', email: '', password: '', rol: '', warehouse_id: '', permissions: [], is_active: true }; this.modal = u ? 'edit' : 'create'; },
    save() {
      const f = this.form;
      if (!f.name || !f.email || !f.rol || (this.modal === 'create' && !f.password)) return Alert.fire('Error', 'Completa los campos obligatorios.', 'error');

// ───────────────────────── Historial de movimientos ─────────────────────────
const HistoryTabs = {
  props: { current: String },
  template: `<div class="flex gap-2 text-xs sm:text-sm"><button class="btn-secondary btn-sm" :class="current === 'sol' ? 'opacity-70 pointer-events-none' : ''" @click="go('solicitudes-historial')"><Icon name="clock-rotate-left"/> Solicitudes</button><button v-if="canSee('inventory-historial')" class="btn-primary btn-sm" :class="current === 'inv' ? 'opacity-70 pointer-events-none' : ''" @click="go('inventory-historial')"><Icon name="boxes-stacked"/> Inventario</button></div>`,
};
const MovementsPage = {
  data() { return { type: '', wh: '', product: null, from: '', to: '', page: 1, detail: null, editing: false, draft: [] }; },
  computed: {
    list() {
      const a = this.from ? dayStart(this.from) : 0; const b = this.to ? dayStart(this.to) + 86400000 : Infinity;
      return S.movements.filter((m) => (!this.type || m.type === this.type) && (!this.wh || m.origin === Number(this.wh) || m.dest === Number(this.wh)) && (!this.product || m.items.some((it) => it.p === this.product)) && m.date >= a && m.date < b && (!isBodega.value || m.user === UI.userId));
    },
    pages() { return Math.max(1, Math.ceil(this.list.length / 15)); },
    rows() { return this.list.slice((this.page - 1) * 15, this.page * 15); },
    MT() { return MOV_TYPES; },
  },
  watch: { type() { this.page = 1; }, wh() { this.page = 1; }, product() { this.page = 1; }, from() { this.page = 1; }, to() { this.page = 1; } },
  methods: {
    units: (m) => m.items.reduce((t, it) => t + it.q, 0),
    clear() { Object.assign(this, { type: '', wh: '', product: null, from: '', to: '' }); },
    open(m) { this.detail = m; this.editing = false; },
    startEdit() { this.draft = clone(this.detail.items); this.editing = true; },
    saveEdit() {
      if (!this.draft.length) return Alert.fire('Sin productos', 'La compra debe conservar al menos un producto. Si deseas borrarla completa usa “Eliminar compra”.', 'warning');
      if (this.draft.some((it) => !(it.q >= 1) || !(it.cost >= 0))) return Alert.fire('Datos inválidos', 'Revisa cantidad y costo unitario antes de guardar.', 'warning');
      const m = this.detail; const prev = {}; m.items.forEach((it) => { prev[it.p + '|' + it.s] = (prev[it.p + '|' + it.s] || 0) + it.q; });
      const next = {}; this.draft.forEach((it) => { next[it.p + '|' + it.s] = (next[it.p + '|' + it.s] || 0) + it.q; });
      for (const k of new Set([...Object.keys(prev), ...Object.keys(next)])) {
        const [p, s] = k.split('|').map(Number); const diff = (next[k] || 0) - (prev[k] || 0);
        if (diff < 0 && stockOf(m.dest, p, s) < -diff) return Alert.fire('Error', 'No se puede reducir o eliminar esta compra porque parte del inventario ya fue usado en otros movimientos.', 'error');
      }
      for (const k of new Set([...Object.keys(prev), ...Object.keys(next)])) { const [p, s] = k.split('|').map(Number); const diff = (next[k] || 0) - (prev[k] || 0); if (diff > 0) addStock(m.dest, p, s, diff); if (diff < 0) takeStock(m.dest, p, s, -diff); }
      m.items = this.draft; this.editing = false; Alert.fire('Éxito', 'Compra actualizada correctamente.', 'success');
    },
    async removePurchase() {
      const m = this.detail;
      const r = await Alert.fire({ title: '¿Eliminar compra?', text: 'Se revertirá el inventario ingresado por esta compra si aún está disponible.', icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí, eliminar', cancelButtonText: 'Cancelar', confirmButtonColor: '#b54545' });
      if (!r.isConfirmed) return;
      if (m.items.some((it) => stockOf(m.dest, it.p, it.s) < it.q)) return Alert.fire('Error', 'No se puede reducir o eliminar esta compra porque parte del inventario ya fue usado en otros movimientos.', 'error');
      m.items.forEach((it) => takeStock(m.dest, it.p, it.s, it.q)); S.movements.splice(S.movements.indexOf(m), 1); this.detail = null;
      Alert.fire('Eliminada', 'Compra eliminada correctamente.', 'success');
    },
  },
  template: `

// ───────────────────────── Traslados ─────────────────────────
function doTransfer({ origin, dest, items, observations }) {
  if (isLocal(dest)) {
    const req = { id: S.seq.req++, type: 'product_request', status: 'delivered', requester_user: UI.userId, local: Number(dest), source: Number(origin), prepared_by: UI.userId, client: null, notes: CONTINGENCY_PREFIX + (observations ? ' | ' + observations : ''), created_at: Date.now(), prepared_at: Date.now(), delivered_at: Date.now(), closed_at: null, items: [] };
    items.forEach((it) => Object.entries(it.sizes).forEach(([s, q]) => { if (takeStock(origin, it.p, s, q)) { addStock(dest, it.p, s, q * 2); req.items.push({ p: it.p, s: Number(s), q }); } }));
    S.requests.unshift(req);
    mov({ type: 'transfer', origin: Number(origin), dest: Number(dest), observations: 'Solicitud de contingencia #' + req.id + (observations ? ' - ' + observations : ''), items: req.items.map((it) => ({ ...it, cost: P(it.p).cost })) });
    return 'local';
  }
  const movItems = [];
  items.forEach((it) => Object.entries(it.sizes).forEach(([s, q]) => { if (takeStock(origin, it.p, s, q)) { addStock(dest, it.p, s, q, P(it.p).cost); movItems.push({ p: it.p, s: Number(s), q, cost: P(it.p).cost }); } }));
  mov({ type: 'transfer', origin: Number(origin), dest: Number(dest), observations: observations || '', items: movItems });
  return 'bodega';
}

const TransferNormal = {
  data() { return { origin: '', dest: '', product: null, sel: [], qty: {}, cart: [], editIdx: null, obs: '' }; },

    origins() { return S.warehouses.filter((w) => !w.type.startsWith('local') && w.is_active); },
    dests() { return S.warehouses.filter((w) => w.id !== Number(this.origin) && w.is_active); },
    options() { if (!this.origin) return []; const ids = new Set(S.inventory.filter((r) => r.w === Number(this.origin) && r.stock > 0).map((r) => r.p)); return S.products.filter((p) => ids.has(p.id)); },
    variants() { if (!this.product) return []; return SIZES.map((s) => ({ s, stock: stockOf(this.origin, this.product, s) })).filter((v) => v.stock > 0); },
    canAdd() { return this.sel.some((s) => Number(this.qty[s]) > 0); },

  methods: {
    units: (it) => Object.values(it.sizes).reduce((a, b) => a + Number(b || 0), 0),
    add() {
      const sizes = {};
      for (const s of this.sel) { const q = Number(this.qty[s]); if (!(q > 0)) continue; const st = stockOf(this.origin, this.product, s); if (q > st) return Alert.fire('Stock insuficiente', 'La talla "' + s + '" solo tiene ' + st + ' unidad(es) disponible(s) en la bodega origen.', 'warning'); sizes[s] = q; }
      if (!Object.keys(sizes).length) return Alert.fire('Sin tallas', 'Ingresa al menos una talla con cantidad mayor a 0.', 'warning');
      if (this.cart.some((c) => c.p === this.product)) return Alert.fire('Producto ya agregado', 'Este producto ya está en el traslado. Edítalo en la lista de abajo.', 'info');
      this.cart.push({ p: this.product, sizes }); this.product = null;
    },
    removeSize(it, s) { delete it.sizes[s]; if (!Object.keys(it.sizes).length) this.cart.splice(this.cart.indexOf(it), 1); },
    async submit() {
      for (const it of this.cart) for (const [s, q] of Object.entries(it.sizes)) if (q > stockOf(this.origin, it.p, s)) return Alert.fire('Cantidad invalida', 'Corrige las cantidades que superan el stock disponible.', 'warning');
      const payload = { origin: Number(this.origin), dest: Number(this.dest), items: clone(this.cart), observations: this.obs };
      if (UI.offline) {
        const r = await Alert.fire({ icon: 'warning', title: 'Sin internet', text: 'No se pudo registrar el traslado. ¿Deseas guardarlo en contingencia para sincronizarlo cuando vuelva la conexión?', showCancelButton: true, confirmButtonText: 'Guardar contingencia', cancelButtonText: 'Cancelar' });
        if (!r.isConfirmed) return;
        payload.observations = 'Contingencia por radio: ' + (this.obs || 'sin observaciones');
        S.queues.transfers.push({ user: UI.userId, payload }); this.reset();
        return Alert.fire('Guardado', 'El traslado quedó en cola local y se sincronizará al volver internet.', 'success');
      }
      const kind = doTransfer(payload); this.reset();
      Alert.fire('Exito', kind === 'local' ? 'Solicitud de contingencia registrada y entregada al local.' : 'Traslado registrado correctamente', 'success');
    },
    reset() { this.cart = []; this.obs = ''; this.product = null; this.editIdx = null; },
  },

      <div v-if="origin" class="field-card"><label class="form-label" for="t-dest">Bodega destino</label><select id="t-dest" class="form-input" v-model="dest" :disabled="cart.length > 0"><option value="">Seleccionar bodega destino</option><option v-for="w in dests" :key="w.id" :value="w.id">{{ w.name }}</option></select>

      <div class="field-card md:col-span-2"><label class="form-label" for="t-prod">Producto</label><ProductPicker v-if="origin" input-id="t-prod" v-model="product" :options="options" placeholder="Buscar producto por nombre o referencia"/><p v-else class="text-sm text-slate-400">Selecciona primero la bodega origen para cargar variantes.</p></div>
    </div>
    <div v-if="product" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <h3 class="section-title flex items-center gap-2"><Icon name="list"/> Seleccionar tallas</h3><p class="text-xs text-slate-500 mb-3">Tallas con stock disponible</p>
      <div v-if="variants.length" class="flex flex-wrap gap-2"><label v-for="v in variants" :key="v.s" class="cursor-pointer rounded-xl border px-3 py-2 text-sm font-semibold" :class="sel.includes(v.s) ? 'border-indigo-500 bg-indigo-50 ring-1 ring-indigo-500/30' : 'border-slate-200 bg-white'"><input type="checkbox" class="sr-only" :value="v.s" v-model="sel"/>{{ v.s }} <span class="font-normal text-gray-400">({{ v.stock }})</span></label></div>

    pair() { return this.local ? pairOf(Number(this.local)) : null; },
    origins() { return S.warehouses.filter((w) => !w.type.startsWith('local') && w.is_active); },
    fullCount() { return (p) => SIZES.filter((s) => pairFull(this.pair, p, s)).length; },
    options() { if (!this.origin || !this.pair) return []; const ids = new Set(S.inventory.filter((r) => r.w === Number(this.origin) && r.stock > 0).map((r) => r.p)); return S.products.filter((p) => ids.has(p.id) && this.fullCount(p.id) < 2); },
    hidden() { if (!this.origin || !this.pair) return 0; const ids = new Set(S.inventory.filter((r) => r.w === Number(this.origin) && r.stock > 0).map((r) => r.p)); return [...ids].filter((p) => this.fullCount(p) >= 2).length; },
    sizes() { if (!this.product) return []; return SIZES.map((s) => ({ s, stock: stockOf(this.origin, this.product, s) })).filter((v) => v.stock > 0 && !pairFull(this.pair, this.product, v.s)); },
    pairsList() { return PAIRS.map(([r, l], i) => ({ i, label: wName(r) + ' ↔ ' + wName(l), right: r, left: l })); },
    bsizes() { if (!this.bp || this.srcPair === '') return []; const pr = this.pairsList[this.srcPair]; return SIZES.filter((s) => pairFull(pr, this.bp, s)); },
  },
  watch: { local() { this.product = null; }, origin() { this.product = null; }, product() { this.size = ''; }, srcPair() { this.dstPair = this.srcPair === '' ? '' : String(1 - Number(this.srcPair)); this.bsize = ''; } },
  methods: {

      if (!this.size) return Alert.fire('Talla requerida', 'Selecciona la talla que vas a exhibir.', 'warning');

      if (this.fullCount(p) >= 2) return Alert.fire('Error', 'Ese producto ya tiene 2 tallas en exhibición en los locales seleccionados.', 'error');
      takeStock(this.origin, p, s, 1);
      [right, left].forEach((w) => { const r = addStock(w, p, s, 0, P(p).cost); r.stock = 1; });
      mov({ type: 'transfer', origin: Number(this.origin), dest: right, observations: (this.obs || 'Montaje de vitrina') + ' [Exhibición: derecho en ' + wName(right) + ']', items: [{ p, s, q: 1, cost: P(p).cost }] });
      mov({ type: 'transfer', origin: Number(this.origin), dest: left, observations: (this.obs || 'Montaje de vitrina') + ' [Exhibición: izquierdo en ' + wName(left) + ']', items: [{ p, s, q: 1, cost: P(p).cost }] });
      toast('✅ Exhibición registrada', 'El par fue distribuido en los 2 locales.', 'success', 2500);

  methods: {

        return r.isConfirmed ? main.id : null;
      }
      if (opts.length === 1) return opts[0].id;
      const r = await Alert.fire({ title, input: 'select', inputOptions: Object.fromEntries(opts.map((o) => [o.id, o.name])), html: '<p class="text-sm text-amber-700">Selecciona la bodega desde donde se tomará el producto.</p>', showCancelButton: true, confirmButtonText: 'Preparar', cancelButtonText: 'Cancelar', confirmButtonColor: '#f59e0b' });
      return r.isConfirmed ? Number(r.value) : null;
    },
    async prepare(req, silent) {
      const src = silent ? (sourceOptions(req)[0] || {}).id : await this.chooseSource(req, '📦 Preparar solicitud');

      if (!silent) Alert.fire('Preparado', 'Solicitud preparada desde "' + wName(src) + '". Lleva los productos al local.', 'success');

    async direct(req, silent) {
      if (!silent) { const src = await this.chooseSource(req, '⚡ Entrega directa'); if (!src) return false; prepareRequest(req, src); }
      else { const o = sourceOptions(req)[0]; if (!o) return false; prepareRequest(req, o.id); }
      const err = deliverRequest(req);
      if (err) { if (!silent) Alert.fire('Error', err, 'error'); return false; }
      if (!silent) Alert.fire('¡Entregado!', 'Inventario movido al local.', 'success');
      return true;
    },
    async deliver(req) {
      const r = await Alert.fire({ title: '¿Confirmar entrega?', text: '¿Los productos ya están en "' + wName(req.local) + '"? Se moverá el inventario a ese local.', icon: 'question', showCancelButton: true, confirmButtonText: 'Sí, entregar', cancelButtonText: 'Cancelar', confirmButtonColor: '#16a34a' });
      if (!r.isConfirmed) return;

    async bulk(kind) {

      for (const r of this.pendingReqs.slice()) { (await (kind === 'prep' ? this.prepare(r, true) : this.direct(r, true))) ? ok++ : fail++; }
      Alert.fire(fail ? 'Proceso parcial' : kind === 'prep' ? 'Preparación completa' : 'Entregas completadas', fail ? 'Preparadas: ' + ok + '. Fallidas: ' + fail + '.' : ok + ' solicitud(es) procesadas.', fail ? 'warning' : 'success');
    },
    replInfo(req) {
      const it = req.items[0]; const g = genderOf(it.sold_size);
      const full = (s) => pairFull(req.pair, it.p, s);

const PosPage = {

    activeCount() { return this.items.filter((it) => ['none', 'pending', 'prepared', 'exchange_pending', 'delivered', 'exchange_done'].includes(this.status(it))).length; },
    cartQty() { return this.cart.reduce((t, it) => t + it.q, 0); },
    subtotal() { return this.cart.reduce((t, it) => t + it.q * (Number(it.price) || 0), 0); },
    accounts() { return S.accounts.filter((a) => accountStatus(a).ok); },
    account() { return S.accounts.find((a) => String(a.id) === String(this.pay)); },

  },
  methods: {

    req: (id) => S.requests.find((r) => r.id === id),

        didOpen: () => { const el = document.getElementById('sw-s'); const info = document.getElementById('sw-st'); const upd = () => { const o = opts.find((x) => x.s === Number(el.value)); info.textContent = o ? 'Stock disponible: ' + o.stock + ' und. (' + o.s + ')' : 'Selecciona talla para ver stock disponible.'; }; el.addEventListener('change', upd); upd(); },
        preConfirm: () => { const v = Number(document.getElementById('sw-s').value); if (!v) { Swal.showValidationMessage('Debes seleccionar una talla'); return false; } return v; },

const SalesPage = {
  data() { const t = isoDay(Date.now()); return { from: t, to: t, pay: '', local: '', consolidated: false, cq: '', detail: null, sel: [] }; },
  computed: {
    list() {
      const a = dayStart(this.from); const b = dayStart(this.to) + 86400000;
      return S.sales.filter((s) => s.date >= a && s.date < b && (!this.pay || (this.pay.startsWith('acc:') ? String(s.payment_account_id) === this.pay.slice(4) : s.payment_method === this.pay)) && (!this.local || s.warehouse_id === Number(this.local)) && (role.value !== 'vendedor' || s.user_id === UI.userId));
    },
    kpi() { return { count: this.list.length, total: this.list.reduce((t, s) => t + s.total, 0), items: this.list.reduce((t, s) => t + s.items.reduce((x, it) => x + it.q, 0), 0) }; },
    consol() {
      const m = {}; this.list.forEach((s) => s.items.forEach((it) => { const k = it.p + '|' + it.price + '|' + s.warehouse_id; m[k] = m[k] || { p: it.p, price: it.price, w: s.warehouse_id, q: 0 }; m[k].q += it.q; }));
      const q = norm(this.cq); return Object.values(m).filter((x) => !q || norm(pName(x.p) + ' ' + (P(x.p) || {}).ref).includes(q)).sort((a, b) => b.q - a.q);
    },
    salesWh() { return S.warehouses.filter((w) => w.type.startsWith('local') || w.id === 2); },
  },
  methods: {
    month(offset) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + offset); const a = isoDay(d.getTime()); const e = new Date(d.getFullYear(), d.getMonth() + 1, 0); this.from = a; this.to = offset === 0 ? isoDay(Date.now()) : isoDay(e.getTime()); },
    clear() { const t = isoDay(Date.now()); Object.assign(this, { from: t, to: t, pay: '', local: '' }); },
    excel() { Alert.fire({ icon: 'info', title: 'Descargar Excel', text: 'En la app instalada se descarga ventas_filtradas_' + isoDay(Date.now()) + '.xls con ' + this.list.length + ' ventas. En esta demo no se descargan archivos.' }); },
    payText(s) { const a = S.accounts.find((x) => x.id === s.payment_account_id); return payLabel(s.payment_method) + (a ? ' — ' + a.account_number : ''); },
    open(s) { this.detail = s; this.sel = []; },
    async delItems() {
      const s = this.detail; const r = await Alert.fire({ title: '¿Eliminar ' + this.sel.length + ' producto(s) de la venta #' + s.id + '?', text: 'Se repondrá inventario en la bodega/local de origen y se recalcularán los totales.', icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí, eliminar productos', cancelButtonText: 'Cancelar', confirmButtonColor: '#b54545' });
      if (!r.isConfirmed) return; deleteSaleItems(s, this.sel); this.sel = []; if (!s.items.length) this.detail = null; toast('Éxito', 'Productos eliminados y stock repuesto.');
    },
    async delSale(s) {
      const r = await Alert.fire({ title: '¿Eliminar venta #' + s.id + '?', text: 'Se eliminará la venta y se repondrá el inventario en la bodega/local de la venta.', icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí, eliminar', cancelButtonText: 'Cancelar', confirmButtonColor: '#b54545' });
      if (!r.isConfirmed) return; deleteSaleItems(s, s.items.map((_, i) => i)); Alert.fire('Éxito', 'Venta eliminada y stock repuesto correctamente.', 'success');
    },
  },
